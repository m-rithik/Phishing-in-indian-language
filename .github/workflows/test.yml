name: Test & Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm ci

    - name: Run unit tests
      run: npm test
      continue-on-error: false

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: node-test-results
        path: test-results/

  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        enable-cache: true

    - name: Sync dependencies
      run: uv sync --locked

    - name: Run unit tests
      run: uv run pytest -q
      continue-on-error: false

  linting:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v2

    - name: Check Python code with ruff
      run: |
        uv pip install ruff
        ruff check fisher_baselines fisher_pilot fisher_transliteration tests --select E,F,W
      continue-on-error: true

    - name: Format check (Black)
      run: |
        uv pip install black
        black --check fisher_baselines fisher_pilot fisher_transliteration tests
      continue-on-error: true

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: Install npm dependencies
      run: npm ci

    - name: Lint JavaScript
      run: |
        npm install --save-dev eslint
        npx eslint browser_extension/*.mjs browser_extension/*.js --max-warnings 5
      continue-on-error: true

  extension-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install uv
      uses: astral-sh/setup-uv@v2

    - name: Validate extension package
      run: uv run python tests/test_extension_package.py -v

  security-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - uses: actions/checkout@v4

    - name: Run Trivy vulnerability scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
      continue-on-error: true

    - name: Upload Trivy results
      if: always()
      uses: github/codeql-action/upload-sarif@v2
      with:
        sarif_file: 'trivy-results.sarif'
      continue-on-error: true

    - name: Check for hardcoded secrets
      run: |
        pip install detect-secrets
        detect-secrets scan --baseline .secrets.baseline || true
      continue-on-error: true

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: Install uv
      uses: astral-sh/setup-uv@v2

    - name: Run Python tests with coverage
      run: |
        uv pip install coverage
        uv run coverage run -m pytest -q
        uv run coverage report --fail-under=70
      continue-on-error: true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  status-check:
    runs-on: ubuntu-latest
    needs: [node-tests, python-tests]
    if: always()

    steps:
    - name: Check test status
      run: |
        if [[ "${{ needs.node-tests.result }}" != "success" ]]; then
          echo "::error::Node.js tests failed"
          exit 1
        fi
        if [[ "${{ needs.python-tests.result }}" != "success" ]]; then
          echo "::error::Python tests failed"
          exit 1
        fi
        echo "✓ All checks passed"
